# https://samber.github.io/awesome-prometheus-alerts/rules#blackbox
groups:
  - name: blackbox_icmp
    rules:
      - alert: BlackboxIcmpEndpointDown
        expr: "probe_success{job='blackbox_icmp'} == 0"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ICMP probe failure"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 5m"

      - alert: BlackboxSlowIcmp
        expr: "avg_over_time(probe_icmp_duration_seconds[1m]) > 1"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ICMP probe high latency"
          description: "ICMP probe took more than 1s\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
