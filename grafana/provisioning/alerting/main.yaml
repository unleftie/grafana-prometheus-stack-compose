# https://grafana.com/docs/grafana/latest/administration/provisioning/#alerting
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning
apiVersion: 1

deleteContactPoints:
  - orgId: 1
    name: grafana-default-email

contactPoints:
  - orgId: 1
    name: blackhole
    receivers:
      - uid: blackhole_receiver
        type: email
        disableResolveMessage: true
        settings:
          addresses: blackhole@localhost

  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram_receiver
        type: telegram
        settings:
          bottoken: ${GRAFANA_TELEGRAM_BOT_TOKEN}
          chatid: |
            $GRAFANA_TELEGRAM_CHAT_ID
          message: |
            {{ template "telegram.default" . }}
          parse_mode: HTML
          disable_web_page_preview: true

  - orgId: 1
    name: telegram_no_resolved
    receivers:
      - uid: telegram_no_resolved_receiver
        type: telegram
        disableResolveMessage: true
        settings:
          bottoken: ${GRAFANA_TELEGRAM_BOT_TOKEN}
          chatid: |
            $GRAFANA_TELEGRAM_CHAT_ID
          message: |
            {{ template "telegram.default" . }}
          parse_mode: HTML
          disable_web_page_preview: true

policies:
  - orgId: 1
    receiver: blackhole
    group_by:
      - job
      - alertname
    group_wait: 15s
    group_interval: 15s
    repeat_interval: 24h
    routes:
      - receiver: telegram_no_resolved
        continue: false
        matchers:
          - no_resolved = true
          - receiver = telegram

      - receiver: telegram
        continue: false
        matchers:
          - receiver = telegram

templates:
  - orgId: 1
    name: telegram
    template: |
      {{ define "telegram.default" }}
      {{ range .Alerts }}
      {{ if eq .Status "firing" }}<b>Severity:</b> {{ .Labels.severity | title }} {{ if eq .Labels.severity "critical" }}🚨{{ else if eq .Labels.severity "warning" }}⚠️{{ else if eq .Labels.severity "info" }}ℹ️{{ else }}🚨{{ end }}{{ else }}Resolved ✅{{ end }}
      <b>Summary:</b> {{ .Annotations.summary }}
      <b>Service:</b> {{ .Labels.service }}
      {{ if eq .Status "firing" }}<b>Starts at:</b> {{ .StartsAt.Local }} {{ else }}<b>Ends at:</b> {{ .EndsAt.Local }} {{ end }}
      {{ end }}
      {{ end }}
